name: Deploy Docs (GitHub Pages)

# Pages 只能托管静态页，不能执行系统 git。
# 真实 git 预览请部署 GHCR 镜像 / 本地 pnpm preview（见 docs/github-deploy.md）。

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site/docs
          cp README.md _site/
          cp -r docs/. _site/docs/
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Git Insight — 真实 git 预览</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
              code, pre { font-family: ui-monospace, Consolas, monospace; }
              pre { background: #f4f4f4; padding: 12px; overflow: auto; border-radius: 6px; }
              .note { border-left: 4px solid #0e639c; padding: 8px 12px; background: #0e639c14; }
              a { color: #0e639c; }
            </style>
          </head>
          <body>
            <h1>Git Insight</h1>
            <p class="note">
              <strong>GitHub Pages 无法执行系统 git。</strong>
              预览页需要 Node 服务在服务端 <code>git clone</code> / <code>merge-tree</code>。
            </p>
            <h2>本地（真实 git）</h2>
            <pre><code>pnpm install
          pnpm preview
          # 浏览器打开后输入：owner/repo 或本机路径</code></pre>
            <h2>云端镜像（真实 git）</h2>
            <pre><code>docker run --rm -p 8080:8080 \
            -e GIT_INSIGHT_MODE=remote \
            ghcr.io/&lt;owner&gt;/&lt;repo&gt;:latest
          # 打开 http://127.0.0.1:8080/ 输入 GitHub 仓库</code></pre>
            <p>详见 <a href="./docs/github-deploy.md">部署说明</a>。</p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
