name: Deploy gh-pages

# 与常见前端项目相同：构建产物推到 gh-pages 分支，再由 GitHub Pages 托管。
# 注意：这是静态站（可看 UI / 文档），不能在访客浏览器里执行系统 git。

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build static preview UI
        run: pnpm --filter @git-insight/webview run build:demo
        env:
          # 项目站地址：https://<user>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Assemble site
        run: |
          mkdir -p _site/docs
          cp -r packages/extension/dist/pages/. _site/
          cp README.md _site/README.md
          cp -r docs/. _site/docs/
          cat > _site/docs/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Git Insight 文档</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
              a { color: #0e639c; }
            </style>
          </head>
          <body>
            <p><a href="../">← 返回预览</a></p>
            <h1>文档</h1>
            <ul>
              <li><a href="./github-deploy.md">部署与在线查看</a></li>
              <li><a href="./plan-git-branch-insight.md">方案保留稿</a></li>
              <li><a href="./graph-engine.md">图引擎选型</a></li>
            </ul>
          </body>
          </html>
          EOF
          # 写入部署信息，方便确认是否为最新构建
          cat > _site/deploy.txt <<EOF
          branch=gh-pages
          repo=${{ github.repository }}
          sha=${{ github.sha }}
          time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          EOF

      - name: Push to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
