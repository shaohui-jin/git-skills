# Release MCP server to npm
#
# 只有 packages/mcp/package.json 的 version 字段发生变化时才打包推送。
# 与 Cursor 插件的发版逻辑一致：版本没变就不推送，避免无意义的重复构建。
#
# Secret: NPM_TOKEN（npm Automation token）
# 文档：docs/mcp-ui-and-release.md、docs/features.md

name: Release MCP server

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # 需要上一个 commit 来比较版本变化

      - name: Check if version changed
        id: version-check
        run: |
          PKG="packages/mcp/package.json"
          
          # 读取当前版本
          CURRENT_VERSION="$(jq -r .version "$PKG")"
          if [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" = "null" ]; then
            echo "::error::无法读取 $PKG 的 version"
            exit 1
          fi
          
          # 读取上一个 commit 的版本（如果是首次提交则视为变化）
          PREV_VERSION=""
          if git show HEAD~1:"$PKG" >/dev/null 2>&1; then
            PREV_VERSION="$(git show HEAD~1:"$PKG" | jq -r .version 2>/dev/null || echo "")"
          fi
          
          echo "当前版本: ${CURRENT_VERSION}"
          echo "上一版本: ${PREV_VERSION:-（无）}"
          
          if [ "$CURRENT_VERSION" = "$PREV_VERSION" ] && [ -n "$PREV_VERSION" ]; then
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
            echo "版本未变化，跳过发布。要发新版请提高 ${PKG} 的 version。"
          else
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            echo "version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"
            echo "版本已变化（${PREV_VERSION:-无} → ${CURRENT_VERSION}），准备发布。"
          fi

      - name: Decide whether to release
        id: gate
        if: steps.version-check.outputs.version_changed == 'true'
        run: |
          VERSION="${{ steps.version-check.outputs.version }}"
          TAG="mcp-server-v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "${TAG} 已发布过，跳过。"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "${TAG} 尚未发布，开始构建。"
          fi

      - name: Setup pnpm
        if: steps.gate.outputs.should_release == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node.js
        if: steps.gate.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: steps.gate.outputs.should_release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build core and webview
        if: steps.gate.outputs.should_release == 'true'
        run: |
          pnpm --filter @shaohui_jin/git-insight-core build
          pnpm --filter git-insight build:webview

      - name: Build MCP package
        if: steps.gate.outputs.should_release == 'true'
        run: pnpm --filter @shaohui_jin/git-insight-mcp-server run check && pnpm --filter @shaohui_jin/git-insight-mcp-server run build

      - name: Publish to npm
        if: steps.gate.outputs.should_release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: packages/mcp
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::未配置 GitHub Secret NPM_TOKEN"
            exit 1
          fi
          npm publish --access public
          echo "已发布 @shaohui_jin/git-insight-mcp-server@${{ steps.version-check.outputs.version }}"

      - name: Create and push tag
        if: steps.gate.outputs.should_release == 'true'
        env:
          TAG: ${{ steps.gate.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "已推送 tag ${TAG}"
